name: Auto Summarize and Post

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Summarizer & Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOARD_URL: ${{ secrets.BOARD_URL }}
          TARGET_THREAD_URL: ${{ secrets.TARGET_THREAD_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/main.py

      - name: Commit and Push updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/posts.json
          git commit -m "Auto update posts" || exit 0
          git push
