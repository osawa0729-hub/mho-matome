<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンハンアウトランダーズ攻略まとめ速報｜5chまとめ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1><a href="./">モンハンアウトランダーズ攻略まとめ速報</a></h1>
      <p>アイソレシア島の新着リーク・ガチャ評価・マルチ募集・5ch反応まとめ</p>
    </div>
  </header>

  <main class="container layout">
    <section id="articles" class="main-col">
      <p>記事を読み込み中...</p>
    </section>

    <aside class="side-col">
      <div class="widget">
        <h3>サイトについて</h3>
        <p>『モンスターハンターアウトランダーズ』の5chスレッドから注目トピックを自動抽出・要約して掲載しています。</p>
      </div>
    </aside>
  </main>

  <script>
    async function loadPosts() {
      const container = document.getElementById("articles");
      try {
        const res = await fetch("posts.json?t=" + Date.now());
        const posts = await res.json();
        if (!posts.length) {
          container.innerHTML = "<p>まだ記事がありません。</p>";
          return;
        }
        container.innerHTML = posts.map(post => `
          <article class="post-card" id="post-${post.id}">
            <div class="post-meta">
              <span class="cat">${post.category}</span>
              <time>${post.published_at}</time>
            </div>
            <h2 class="post-title">${post.title}</h2>
            <div class="post-summary">${post.summary}</div>
            <div class="thread-box">
              ${post.picked_comments.map(c => `
                <div class="res-item">
                  <div class="res-head">${c.number}: ${c.header}</div>
                  <div class="res-body" style="color:${c.color || '#222'};font-weight:${c.is_bold ? 'bold' : 'normal'}">
                    ${c.body.replace(/\n/g, "<br>")}
                  </div>
                </div>
              `).join("")}
            </div>
          </article>
        `).join("");
      } catch (e) {
        container.innerHTML = "<p>記事データの読み込みに失敗しました。</p>";
      }
    }
    loadPosts();
  </script>
</body>
</html>
